<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المحامي محمد الحنوش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#1E2219;--dark2:#272C21;--olive:#5A6B3A;--olive-d:#3E4A28;--gold:#C2A060;--gold-d:#A8864A;
--cream:#F6F3EA;--cream2:#ECE7D8;--ink:#23261E;--soft:#4B4F43;--muted:#72766A;--line:#E1DBCB;--wa:#25A35A;
--body:"Noto Naskh Arabic","Noto Serif",serif;--display:var(--body);--r:18px}
html[lang="en"]{--body:"Noto Serif","Noto Naskh Arabic",serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--cream);line-height:1.85;font-size:17px;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:24px}
.ltr{direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}

/* header (Al-Saadoon layout) */
header{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;height:84px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--olive-d);display:grid;place-items:center;flex-shrink:0}
.logo svg{width:28px;height:28px;stroke-width:1.7}
.bt{display:grid;line-height:1.25}
.bt b{font-weight:700;font-size:22px}
.bt small{font-size:12px;color:#B9BDAE}
nav ul{display:flex;gap:30px;list-style:none}
nav a{text-decoration:none;font-size:16px;color:#E6E8DF}
nav a:hover{color:var(--gold)}
.tools{display:flex;align-items:center;gap:10px}
.langs{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
.langs button{background:none;border:0;color:#D5D8CC;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:#fff}
.menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px;border-radius:12px;cursor:pointer}
.subbar{padding-bottom:14px}
.admin-pill{display:inline-flex;align-items:center;gap:8px;background:var(--dark2);color:#D5D8CC;font-size:14px;text-decoration:none;padding:8px 18px;border-radius:999px}
.admin-pill svg{width:17px;height:17px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid transparent;cursor:pointer;text-decoration:none;font-weight:700;padding:14px 30px;font-size:17px;border-radius:999px;background:var(--gold);color:var(--dark);transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn-line{background:transparent;color:#fff;border-color:#fff}
.bar .btn{padding:11px 24px;font-size:16px}
.btn.olive{background:var(--olive);color:#fff}

.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(30,34,25,.92),rgba(30,34,25,.55))}
html[dir="ltr"] .hero-bg::after{background:linear-gradient(to right,rgba(30,34,25,.92),rgba(30,34,25,.55))}
.hero-in{position:relative;display:grid;grid-template-columns:1.35fr 1fr;gap:60px;align-items:center;padding-block:70px 90px;min-height:560px}
.hero h1{font-weight:700;font-size:clamp(40px,6.4vw,78px);line-height:1.2}
.hero h1 span{display:block}
.hero h1 em{display:block;font-style:normal;color:var(--gold)}
.hero p{margin-top:22px;font-size:20px;color:#E4E6DC;max-width:44ch}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.fact{display:flex;align-items:center;gap:8px;font-size:14px;color:#E4E6DC;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 14px;border-radius:999px}
.fact svg{width:16px;height:16px;color:var(--gold)}
.portrait{justify-self:center;width:100%;max-width:340px}
.photo{aspect-ratio:4/5;border-radius:26px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 30px 60px rgba(0,0,0,.35)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top}

/* brand band */
.band{background:var(--cream);padding-block:70px;text-align:center}
.emblem{display:inline-flex;align-items:center;gap:18px}
.emblem .logo{width:84px;height:84px;background:var(--olive-d);color:var(--gold)}
.emblem .logo svg{width:44px;height:44px}
.emblem b{display:block;font-weight:700;font-size:36px;line-height:1.2;text-align:start}
.emblem small{display:block;font-size:19px;color:var(--soft);text-align:start}

/* sections */
section{padding-block:90px;scroll-margin-top:84px}
.alt{background:var(--cream2)}
.head{margin-bottom:44px}
.eyebrow{display:inline-block;color:var(--olive);font-weight:700;font-size:15px;background:rgba(90,107,58,.1);padding:5px 16px;border-radius:999px;margin-bottom:12px}
h2{font-weight:700;font-size:clamp(30px,4vw,46px);line-height:1.3}
h2 em{font-style:normal;color:var(--gold-d)}
.lead{color:var(--soft);max-width:60ch;margin-top:10px;font-size:18px}
.ic{width:52px;height:52px;border-radius:16px;background:var(--olive);color:#fff;display:grid;place-items:center;flex-shrink:0}
.ic svg.i{width:24px;height:24px}

.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.about blockquote{font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.7;border-inline-start:4px solid var(--gold);padding-inline-start:20px;margin-top:26px}
.creds,.certs{display:grid;gap:14px}
.certs{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cred,.cert{background:#fff;border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 2px 0 var(--line)}
.cred b,.cert b{display:block;font-weight:700;font-size:18px}
.cred span,.cert span{color:var(--muted);font-size:15px}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:#fff;border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 var(--line);transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card h3{font-weight:700;font-size:22px}
.card p{color:var(--soft);font-size:16px}
.card .book-link{margin-top:auto;align-self:flex-start;background:var(--dark);color:#fff;border:0;border-radius:999px;padding:9px 20px;font-weight:700;font-size:14px;cursor:pointer}

.finder,.booking{background:var(--dark);color:#fff}
.finder .lead,.booking .lead{color:#C9CCBF}
.finder .eyebrow,.booking .eyebrow{background:rgba(194,160,96,.15);color:var(--gold)}
.fq,.bk{background:var(--dark2);border-radius:26px;padding:34px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.step,.fq>div{min-width:0}
.fq h3,.step h3{font-weight:700;font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:12px;color:#fff}
.step h3 b{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--dark);display:grid;place-items:center;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 20px;cursor:pointer;font-size:15px;font-weight:500;color:#EDEEE6}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--dark);font-weight:700}
.days{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 86px;text-align:center;padding:10px 6px;border-radius:18px;line-height:1.45}
.day small{display:block;font-size:12px;opacity:.8}
.day b{display:block;font-size:24px;font-weight:700}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields label{display:grid;gap:6px;font-size:14px;color:#C9CCBF}
.fields .full{grid-column:1/-1}
.fields input,.fields textarea{background:var(--dark);border:1.5px solid rgba(255,255,255,.14);border-radius:14px;padding:13px 16px;color:#fff;width:100%}
.fields input:focus,.fields textarea:focus{border-color:var(--gold);outline:none}
.fields textarea{min-height:90px;resize:vertical}
.summary{background:var(--dark);border-radius:16px;padding:16px 20px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 26px;color:#C9CCBF}
.summary span{color:var(--gold);font-weight:700}
.msg{font-size:15px;min-height:1.4em}
.msg.err{color:#F0A898}.msg.ok{color:#9ED9B2}
.consent{font-size:14px;color:#C9CCBF}
.consent button,.linkish{background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;font-size:inherit;padding:0}
.result{background:var(--gold);color:var(--dark);border-radius:20px;padding:26px;display:grid;gap:8px}
.result b{font-weight:700;font-size:28px}
.result small{opacity:.8;font-size:14px}
.result .btn{justify-self:start;margin-top:8px;background:var(--dark);color:#fff}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;list-style:none}
.steps li{background:#fff;border-radius:var(--r);padding:24px;box-shadow:0 2px 0 var(--line)}
.steps b{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--olive);color:#fff;font-weight:700;font-size:18px}
.steps h3{font-weight:700;font-size:18px;margin:12px 0 4px}
.steps p{color:var(--muted);font-size:15px;line-height:1.75}

.dl{background:var(--olive-d);color:#fff;border-radius:26px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.dl .eyebrow{background:rgba(194,160,96,.18);color:var(--gold)}
.dl .lead{color:#D6DACB}
.dl .fields label{color:#D6DACB}
.dl .fields input{background:rgba(0,0,0,.2)}
.dl .msg{color:#F3C4B8}
.dl .btn{background:var(--gold);color:var(--dark)}
.checklist{list-style:none;display:grid;gap:12px;background:rgba(0,0,0,.15);border-radius:18px;padding:22px}
.checklist li{display:flex;gap:12px;align-items:flex-start}
.checklist li::before{content:"✓";color:var(--dark);background:var(--gold);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:4px}

.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.post{background:#fff;border-radius:var(--r);padding:24px;box-shadow:0 2px 0 var(--line);border-top:4px solid var(--gold)}
.post small{color:var(--olive);font-weight:700;font-size:13px}
.post h3{font-weight:700;font-size:19px;line-height:1.6;margin-top:6px}

.faq{display:grid;gap:12px;max-width:860px}
.faq details{background:#fff;border-radius:var(--r);padding:18px 24px;box-shadow:0 2px 0 var(--line)}
.faq summary{cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";width:30px;height:30px;border-radius:50%;background:var(--cream2);color:var(--olive-d);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.faq details[open] summary::after{content:"−";background:var(--olive);color:#fff}
.faq p{color:var(--soft);margin-top:10px}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.ci{background:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;text-decoration:none;box-shadow:0 2px 0 var(--line)}
.ci b{font-size:14px;color:var(--muted);font-weight:500}
.ci span{font-weight:700;overflow-wrap:anywhere}
.map{margin-top:20px;border-radius:22px;overflow:hidden;aspect-ratio:16/7;background:#fff}
.map iframe{width:100%;height:100%;border:0}
.card-kit{margin-top:20px;display:flex;gap:24px;align-items:center;background:var(--dark);color:#fff;border-radius:22px;padding:24px;flex-wrap:wrap}
.card-kit img{width:120px;height:120px;border-radius:14px;background:#fff;padding:6px}
.card-kit div{flex:1;min-width:200px;display:grid;gap:8px}
.card-kit b{font-weight:700;font-size:22px}
.card-kit span{color:#C9CCBF}
.card-kit .btn{justify-self:start;padding:10px 22px;font-size:15px}

footer{background:var(--dark);color:#B9BDAE;font-size:14px;padding-block:30px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center}

dialog.priv{border:0;border-radius:24px;padding:0;width:min(640px,94vw);max-height:88vh;margin:auto;background:var(--cream);color:var(--ink)}
dialog.priv::backdrop{background:rgba(20,22,16,.6)}
.priv-in{padding:30px;display:grid;gap:14px}
.priv-in h2{font-size:28px}
.priv-in p{color:var(--soft)}
.priv-in .btn{background:var(--dark);color:#fff}

.wa-float{position:fixed;bottom:22px;inset-inline-end:22px;z-index:30;background:var(--wa);color:#fff;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.wa-float svg{width:30px;height:30px}


/* Ruqaa headings */
.bt b,.hero h1,.emblem b,h2,.card h3,.cred b,.cert b,.steps h3,.post h3,.faq summary,.result b,.card-kit b,.priv-in h2{font-family:var(--display);font-weight:700}
.hero h1{line-height:1.5}
h2{line-height:1.6}
.bt b{font-size:24px}
.emblem b{font-size:40px}
.card h3{font-size:25px}
.faq summary{font-size:20px}
.steps h3{font-size:20px}
.post h3{font-size:21px}
html[lang="en"] .hero h1{line-height:1.2}
@media print{header,.wa-float,footer,section:not(#docs){display:none}#dlForm{display:none}}
@media (max-width:980px){
  nav{display:none}
  nav.open{display:block;position:absolute;top:84px;inset-inline:0;background:var(--dark);padding:10px 24px 24px;border-top:1px solid rgba(255,255,255,.08)}
  nav.open ul{flex-direction:column;gap:14px}
  .menu-btn{display:grid}
  .subbar{display:none}
  .bar .btn{display:none}
  .hero-in{grid-template-columns:1fr;gap:34px;padding-block:36px 60px;min-height:0}
  .portrait{max-width:230px;order:-1}
  .hero h1{font-size:clamp(34px,10vw,48px)}
  .hero p{font-size:18px}
  .about .wrap{grid-template-columns:1fr;gap:36px}
  .cards,.steps,.posts{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;padding:24px}
  .fq,.bk{padding:22px}
  .map{aspect-ratio:4/3}
  section{padding-block:64px}
  .emblem b{font-size:28px}.emblem .logo{width:66px;height:66px}
}
@media (max-width:520px){.bt small{display:none}.bt b{font-size:19px}.logo{width:46px;height:46px}.langs button{padding:5px 8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>

sel.mode=0; let fin={q1:null,q2:null,q3:null};

function finderResult(){
  if(fin.q1===0) return "branch";
  if(fin.q1===null||fin.q2===null) return null;
  if(fin.q2===2) return "jsc";
  if(fin.q3===null) return null;
  if(fin.q2===0) return fin.q3===0?"llc":"sole";
  return fin.q3===0?"llc":"gen";
}
function renderExtra(){
  const t=T[lang];
  $("certList").innerHTML=t.certs.map(c=>`<div class="cert"><div class="ic"><svg class="i"><use href="#${c[0]}"/></svg></div><div><b>${c[1]}</b><span>${c[2]}</span></div></div>`).join("");
  const qBlock=(k,q,o)=>`<div><h3>${q}</h3><div class="opts">${o.map((x,i)=>`<button class="opt" data-fq="${k}" data-v="${i}" aria-pressed="${fin[k]===i}">${x}</button>`).join("")}</div></div>`;
  let h=qBlock("q1",t.q1,t.q1o);
  if(fin.q1===1){h+=qBlock("q2",t.q2,t.q2o); if(fin.q2===0||fin.q2===1) h+=qBlock("q3",t.q3,t.q3o);}
  const r=finderResult();
  if(r) h+=`<div class="result"><small>${t.rTitle}</small><b>${t.r[r][0]}</b><div>${t.r[r][1]}</div><small>${t.rNote}</small><a class="btn" href="#booking" id="finBook">${t.rBtn}</a></div>`;
  $("finderBox").innerHTML=h;
  $("optMode").innerHTML=t.modes.map((m,i)=>`<button class="opt" data-mode="${i}" aria-pressed="${sel.mode===i}">${m}</button>`).join("");
  $("summary").insertAdjacentHTML("beforeend",`<div>${t.sMode}: <span>${t.modes[sel.mode]}</span></div>`);
  $("checklist").innerHTML=t.checklist.map(c=>`<li>${c}</li>`).join("");
  $("faqList").innerHTML=t.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
  document.querySelectorAll("[data-fq]").forEach(b=>b.onclick=()=>{const k=b.dataset.fq;fin[k]=+b.dataset.v;if(k==="q1"){fin.q2=null;fin.q3=null}if(k==="q2")fin.q3=null;renderDynamic();});
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{sel.mode=+b.dataset.mode;renderDynamic();});
  const fb=$("finBook"); if(fb) fb.onclick=()=>{sel.svc=0;renderDynamic();};
}

const locale=()=>lang==="en"?"en-GB":lang==="ku"?"ckb-IQ":"ar-IQ";
const days=()=>{const out=[],d=new Date();d.setHours(0,0,0,0);while(out.length<DAYS_AHEAD){if(d.getDay()!==OFF_DAY)out.push(new Date(d));d.setDate(d.getDate()+1);}return out};

function renderDynamic(){
  const t=T[lang];
  $("svcCards").innerHTML=t.svc.map((s,i)=>`<div class="card"><div class="ic"><svg class="i"><use href="#${SVC_IC[i]}"/></svg></div><h3>${s[0]}</h3><p>${s[1]}</p><button class="book-link" data-pick="${i}">${t.bookThis} ←</button></div>`).join("");
  $("optSvc").innerHTML=t.svc.map((s,i)=>`<button class="opt" data-svc="${i}" aria-pressed="${sel.svc===i}">${s[0]}</button>`).join("");
  const todayIso=iso(new Date());
  $("optDay").innerHTML=days().map(d=>{const k=iso(d);return `<button class="opt day" data-day="${k}" aria-pressed="${sel.day===k}"><small>${k===todayIso?t.today:d.toLocaleDateString(locale(),{weekday:"short"})}</small><b>${d.toLocaleDateString(locale(),{day:"numeric"})}</b><small>${d.toLocaleDateString(locale(),{month:"short"})}</small></button>`}).join("");
  const now=new Date(), isToday=sel.day===todayIso;
  $("optTime").innerHTML=SLOTS.map(s=>{const [h,m]=s.split(":").map(Number);const past=isToday&&(h*60+m)<=(now.getHours()*60+now.getMinutes()+60);return past?"":`<button class="opt" data-time="${s}" aria-pressed="${sel.time===s}"><span class="ltr">${s}</span></button>`}).join("");
  $("gSteps").innerHTML=t.g.map((g,i)=>`<li><b>${(i+1).toLocaleString(locale())}</b><h3>${g[0]}</h3><p>${g[1]}</p></li>`).join("");
  $("pList").innerHTML=t.p.map(p=>`<article class="post"><small>${p[0]}</small><h3>${p[1]}</h3></article>`).join("");
  $("summary").innerHTML=`<div>${t.sSvc}: <span>${sel.svc!==null?t.svc[sel.svc][0]:t.none}</span></div><div>${t.sDay}: <span>${sel.day?fmtDay(sel.day):t.none}</span></div><div>${t.sTime}: <span class="ltr">${sel.time||t.none}</span></div>`;
  bindDynamic();
}
